<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./src/style.css" />
    <title>Elevator</title>
  </head>
  <body>
    <main class="h-screen bg-primary-green">
      <div class="h-full flex justify-center items-center">
        <div class="h-9/10 min-w-3/5 bg-gray-900 p-1">
          <div class="h-full grid grid-cols-[1fr_4fr_1fr] grid-rows-1 bg-[url(./images/corridor.jpg)] bg-center bg-no-repeat bg-cover">
            <div class="bg-primary-orange border-r-2 border-r-gray-700 border-r-solid"></div>
            <div class="relative overflow-hidden">
              <div id="elevator-left-door" class="absolute h-full w-1/2 top-0 bottom-0 -left-1/2 bg-primary-yellow border-r-2 border-r-gray-900 border-r-solid transtion-all duration-2000"></div>
              <div id="elevator-right-door" class="absolute h-full w-1/2 top-0 bottom-0 -right-1/2 bg-primary-yellow border-l-2 border-l-gray-900 border-l-solid transtion-all duration-2000"></div>
            </div>
            <div class="bg-primary-orange border-l-2 border-l-gray-700 border-l-solid flex flex-col justify-center items-center gap-y-20">
              <div class="w-4/5 bg-primary-green border-2 border-gray-700 border-solid flex justify-center items-center gap-x-5 p-1">
                <div class="flex flex-col justify-center items-center text-white gap-y-1">
                  <span>Floor</span>
                  <span>1</span>
                </div>
                <div class="flex justify-center items-center text-white">
                  <i class="fa-solid fa-circle-up"></i>
                </div>
              </div>
              <div class="w-4/5 h-1/2 bg-primary-green border-2 border-gray-700 border-solid grid grid-cols-2 grid-rows-6 p-1 items-center">
                <label for="floor-10" class="cursor-pointer size-7 bg-gray-300 text-gray-900 rounded-full justify-self-center flex justify-center items-center border border-gray-700 has-checked:bg-primary-red">
                  <span>10</span>
                  <input id="floor-10" type="checkbox" class="floor-btn hidden"/>
                </label>
                <label for="floor-9" class="cursor-pointer size-7 bg-gray-300 text-gray-900 rounded-full justify-self-center flex justify-center items-center border border-gray-700 has-checked:bg-primary-red">
                  <span>9</span>
                  <input id="floor-9" type="checkbox" class="floor-btn hidden"/>
                </label>
                <label for="floor-8" class="cursor-pointer size-7 bg-gray-300 text-gray-900 rounded-full justify-self-center flex justify-center items-center border border-gray-700 has-checked:bg-primary-red">
                  <span>8</span>
                  <input id="floor-8" type="checkbox" class="floor-btn hidden"/>
                </label>
                <label for="floor-7" class="cursor-pointer size-7 bg-gray-300 text-gray-900 rounded-full justify-self-center flex justify-center items-center border border-gray-700 has-checked:bg-primary-red">
                  <span>7</span>
                  <input id="floor-7" type="checkbox" class="floor-btn hidden"/>
                </label>
                <label for="floor-6" class="cursor-pointer size-7 bg-gray-300 text-gray-900 rounded-full justify-self-center flex justify-center items-center border border-gray-700 has-checked:bg-primary-red">
                  <span>6</span>
                  <input id="floor-6" type="checkbox" class="floor-btn hidden"/>
                </label>
                <label for="floor-5" class="cursor-pointer size-7 bg-gray-300 text-gray-900 rounded-full justify-self-center flex justify-center items-center border border-gray-700 has-checked:bg-primary-red">
                  <span>5</span>
                  <input id="floor-5" type="checkbox" class="floor-btn hidden"/>
                </label>
                <label for="floor-4" class="cursor-pointer size-7 bg-gray-300 text-gray-900 rounded-full justify-self-center flex justify-center items-center border border-gray-700 has-checked:bg-primary-red">
                  <span>4</span>
                  <input id="floor-4" type="checkbox" class="floor-btn hidden"/>
                </label>
                <label for="floor-3" class="cursor-pointer size-7 bg-gray-300 text-gray-900 rounded-full justify-self-center flex justify-center items-center border border-gray-700 has-checked:bg-primary-red">
                  <span>3</span>
                  <input id="floor-3" type="checkbox" class="floor-btn hidden"/>
                </label>
                <label for="floor-2" class="cursor-pointer size-7 bg-gray-300 text-gray-900 rounded-full justify-self-center flex justify-center items-center border border-gray-700 has-checked:bg-primary-red">
                  <span>2</span>
                  <input id="floor-2" type="checkbox" class="floor-btn hidden"/>
                </label>
                <label for="floor-1" class="cursor-pointer size-7 bg-gray-300 text-gray-900 rounded-full justify-self-center flex justify-center items-center border border-gray-700 has-checked:bg-primary-red">
                  <span>1</span>
                  <input id="floor-1" type="checkbox" class="floor-btn hidden"/>
                </label>
                <label for="elevator-close" class="cursor-pointer text-xs size-7 bg-gray-300 text-gray-900 rounded-full justify-self-center flex justify-center items-center gap-x-1  border border-gray-700 has-checked:bg-primary-red disabled:bg-gray-900">
                  <span><i class="fa-solid fa-chevron-right"></i></span>
                  <span><i class="fa-solid fa-chevron-left"></i></span>
                  <input id="elevator-close" type="radio" class="hidden" name="elevator-doors-buttons"/>
                </label>
                <label for="elevator-open" class="cursor-pointer text-xs  size-7 bg-gray-300 text-gray-900 rounded-full justify-self-center flex justify-center items-center gap-x-1 border border-gray-700 has-checked:bg-primary-red disabled:bg-gray-900">
                  <span><i class="fa-solid fa-chevron-left"></i></span>
                  <span><i class="fa-solid fa-chevron-right"></i></span>
                  <input checked id="elevator-open" type="radio" class="hidden" name="elevator-doors-buttons"/>
                </label>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
