<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./src/style.css" />
    <title>Elevator</title>
  </head>
  <body>
    <main class="h-screen bg-primary-green">
      <div class="h-full flex justify-center items-center">
        <div class="min-w-3/5 bg-gray-900 p-1 h-200">
          <div class="h-full grid grid-cols-[1fr_4fr_1fr] grid-rows-1">
            <div class="bg-primary-orange border-r-2 border-r-gray-700 border-r-solid"></div>
            <div class="relative overflow-hidden">
              <div id="elevator-left-door" class="z-20 absolute h-full w-1/2 top-0 bottom-0 left-0 bg-primary-yellow opacity-[0.9] border-r-2 border-r-gray-900 border-r-solid transtion-all duration-1000"></div>
              <div id="corridors" class="absolute top-0 left-0  min-h-200 w-full">
              </div>
              <div id="elevator-right-door" class="z-20 absolute h-full w-1/2 top-0 bottom-0 right-0 bg-primary-yellow opacity-[0.9] border-l-2 border-l-gray-900 border-l-solid transtion-all duration-1000"></div>
            </div>
            <div class="bg-primary-orange border-l-2 border-l-gray-700 border-l-solid flex flex-col justify-center items-center gap-y-20">
              <div class="w-4/5 bg-primary-green border-2 border-gray-700 border-solid flex justify-center items-center gap-x-5 p-1">
                <div class="flex flex-col justify-center items-center text-white gap-y-1">
                  <span>Floor</span>
                  <span id="floor-number">1</span>
                </div>
                <div id="floor-arrow" class="flex justify-center items-center text-white">
                  <i class="fa-solid fa-circle-up"></i>
                </div>
              </div>
              <div class="w-4/5  bg-primary-green border-2 border-gray-700 border-solid grid grid-cols-1 grid-rows-[3fr_1fr] p-1 items-center">
                <div id="floor-panel" class="grid grid-cols-2 grid-rows-5 gap-2 items-center"></div>
                <div class="grid grid-cols-2 items-center">
                  <label for="elevator-close" class="cursor-pointer text-xs size-7 bg-gray-300 text-gray-900 rounded-full justify-self-center flex justify-center items-center gap-x-1  border border-gray-700 has-checked:bg-primary-red has-disabled:bg-gray-900">
                    <span><i class="fa-solid fa-chevron-right"></i></span>
                    <span><i class="fa-solid fa-chevron-left"></i></span>
                    <input checked id="elevator-close" type="radio" class="hidden" name="elevator-doors-buttons"/>
                  </label>
                  <label for="elevator-open" class="cursor-pointer text-xs  size-7 bg-gray-300 text-gray-900 rounded-full justify-self-center flex justify-center items-center gap-x-1 border border-gray-700 has-checked:bg-primary-red has-disabled:bg-gray-900">
                    <span><i class="fa-solid fa-chevron-left"></i></span>
                    <span><i class="fa-solid fa-chevron-right"></i></span>
                    <input id="elevator-open" type="radio" class="hidden" name="elevator-doors-buttons"/>
                  </label>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
